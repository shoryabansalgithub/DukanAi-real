# DukaanAI from a fresh clone (roadmap 7.3):
#
#   cp .env.example .env            # then set JWT_SECRET and NEXTAUTH_SECRET
#   docker compose up --build -d --wait
#
# Boot order: mysql and redis become healthy -> `migrate` runs
# `prisma migrate deploy` once and exits 0 (the release step; the API never
# migrates on its own) -> api starts and is healthy once its readiness probe
# passes -> web starts. `scripts/compose-smoke.sh` drives this end to end
# (migrations, register, login, a sale, a graceful stop).
#
# Secrets come from .env (git-ignored); every other value has a local default.
# Production deployments keep the same images and release step and supply the
# environment from their orchestrator: see docs/DEPLOYMENT.md.
name: dukaanai

services:
  mysql:
    image: mysql:8.0
    # Migrations create the ledger immutability triggers; with binary logging on
    # (MySQL 8 default) a non-SUPER user may only do so with this flag.
    command: ["mysqld", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dukaanai}
      MYSQL_USER: ${MYSQL_USER:-dukaanai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dukaanai-local-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Append-only so queued BullMQ jobs and outbox claims survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Release step: applies pending migrations and exits. Re-run on every
  # deploy (`docker compose run --rm migrate`); it is a no-op when nothing is pending.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: dukaanai-api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-dukaanai}:${MYSQL_PASSWORD:-dukaanai-local-only}@mysql:3306/${MYSQL_DATABASE:-dukaanai}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    image: dukaanai-api
    environment:
      NODE_ENV: production
      PORT: "3002"
      # Browser origin(s) allowed by CORS and the socket adapter.
      FRONTEND_URL: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: mysql://${MYSQL_USER:-dukaanai}:${MYSQL_PASSWORD:-dukaanai-local-only}@mysql:3306/${MYSQL_DATABASE:-dukaanai}?connection_limit=${API_DB_CONNECTION_LIMIT:-20}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters, e.g. `openssl rand -hex 32`)}
      # The web server forwards the browser's address on sign-in: one hop.
      TRUST_PROXY: "1"
      STORAGE_ROOT: /var/lib/dukaanai/storage
      UPLOAD_TEMP_DIR: uploads/tmp
      # Shutdown: readiness flips to 503 on SIGTERM, in-flight work finishes,
      # then BullMQ, Redis and Prisma close; stop_grace_period exceeds the sum.
      SHUTDOWN_DRAIN_DELAY_MS: "0"
      SHUTDOWN_TIMEOUT_MS: "30000"
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-DukaanAI <no-reply@dukaanai.local>}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Observability (roadmap 7.6): JSON logs at this level, GET /api/metrics
      # (bearer token when METRICS_TOKEN is set), error tracking once SENTRY_DSN is set.
      LOG_LEVEL: ${LOG_LEVEL:-log}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      APP_RELEASE: ${APP_RELEASE:-}
    ports:
      - "${API_PORT:-3002}:3002"
    volumes:
      - api-storage:/var/lib/dukaanai/storage
      - api-uploads:/app/apps/api/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness (database + Redis + not draining), not just liveness: `web`
      # starts, and `--wait` returns, only when the API can serve a request.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle: the API URL as the browser sees it.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:3002/api}
    image: dukaanai-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (32+ characters, e.g. `openssl rand -hex 32`)}
      NEXTAUTH_URL: ${WEB_ORIGIN:-http://localhost:3000}
      # The server reads this one at runtime too (Content-Security-Policy connect-src).
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:3002/api}
      # Sign-in and token refresh go to the API over the compose network.
      API_INTERNAL_URL: http://api:3002/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Backups (roadmap 7.7, profile "ops"): a MySQL 8 client container with
  # scripts/db mounted; backups land in the db-backups volume. Schedule the
  # backup line from the host's cron and copy the volume off the host.
  #   docker compose --profile ops run --rm db-ops backup
  #   docker compose --profile ops run --rm db-ops list
  #   docker compose --profile ops run --rm db-ops restore /backups/<file>.sql.gz --yes
  # The restore drill (scripts/db/restore-drill.sh) needs CREATE DATABASE:
  # run it from a checkout with DATABASE_URL on the root user (docs/BACKUP_RESTORE.md).
  db-ops:
    image: mysql:8.0
    profiles: ["ops"]
    entrypoint: ["bash", "/scripts/db-ops.sh"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-dukaanai}:${MYSQL_PASSWORD:-dukaanai-local-only}@mysql:3306/${MYSQL_DATABASE:-dukaanai}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/db:/scripts:ro
      - db-backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # Optional (profile "ops"): Prometheus with the alert rules in
  # deploy/prometheus, scraping the API over the compose network.
  #   docker compose --profile ops up -d prometheus   -> http://localhost:9090
  # With METRICS_TOKEN set, uncomment the `authorization` block in
  # deploy/prometheus/prometheus.yml and mount the token file it names.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["ops"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  api-storage:
  api-uploads:
  db-backups:
  prometheus-data:
