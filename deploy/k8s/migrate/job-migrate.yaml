# The release step: `prisma migrate deploy` from the API image of the release
# being deployed (the tag in ../common/kustomization.yaml), applied on its own
# BEFORE the application (README.md, "Release"; audit 2026-10-11, P1-16). A
# Job is immutable, so each release re-creates it once the previous one has
# finished: never delete a Job that is still running (`kubectl -n dukaanai
# get job dukaanai-migrate` shows ACTIVE 0 or no Job), a migration killed in
# the middle of its DDL is recorded as failed (apps/api/prisma/MIGRATIONS.md).
# An API started before the Job completed refuses to boot: every migration in
# its image must be applied (PrismaService.assertSchemaInSync).
apiVersion: batch/v1
kind: Job
metadata:
  name: dukaanai-migrate
  labels:
    app.kubernetes.io/name: dukaanai-migrate
    app.kubernetes.io/part-of: dukaanai
spec:
  backoffLimit: 0
  # Long enough for the release manager to read the log; the next release's
  # step deletes it anyway.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dukaanai-migrate
        app.kubernetes.io/part-of: dukaanai
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: dukaanai-api
          command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dukaanai-secrets
                  key: DATABASE_URL
            # Read-only root file system: whatever the CLI writes goes to /tmp.
            - name: HOME
              value: /tmp
            - name: CHECKPOINT_DISABLE
              value: "1"
          volumeMounts:
            - name: db-ca
              mountPath: /etc/dukaanai
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: db-ca
          secret:
            secretName: dukaanai-db-ca
            optional: true
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
