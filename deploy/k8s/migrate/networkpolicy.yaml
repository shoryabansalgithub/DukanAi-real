# The release step talks to the database (and DNS) only; applied with the
# Job, so it is in place before the Job's pod starts. The 3306 / 0.0.0.0/0
# assumption is the one ../networkpolicy.yaml documents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dukaanai-migrate
  labels:
    app.kubernetes.io/part-of: dukaanai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dukaanai-migrate
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { port: 3306, protocol: TCP }
