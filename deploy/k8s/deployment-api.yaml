# The API: one replica (the documents volume is ReadWriteOnce and the
# backup sidecar reads it), Recreate so the old pod releases the volumes
# before the new one claims them. Probes per docs/DEPLOYMENT.md; the grace
# period exceeds SHUTDOWN_DRAIN_DELAY_MS + SHUTDOWN_TIMEOUT_MS. Hardened
# (audit 2026-10-11, R25): no service-account token, read-only root file
# systems with an emptyDir /tmp each (the documents, uploads with their
# multipart temp directory, and backups are the volumes below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dukaanai-api
  labels:
    app.kubernetes.io/name: dukaanai-api
    app.kubernetes.io/part-of: dukaanai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dukaanai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dukaanai-api
        app.kubernetes.io/part-of: dukaanai
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: dukaanai-api
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3002"
            - name: FRONTEND_URL
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: WEB_ORIGIN } }
            - name: TRUST_PROXY
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: TRUST_PROXY } }
            - name: STORAGE_ROOT
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: STORAGE_ROOT } }
            - name: UPLOAD_TEMP_DIR
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: UPLOAD_TEMP_DIR } }
            - name: SHUTDOWN_DRAIN_DELAY_MS
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: SHUTDOWN_DRAIN_DELAY_MS } }
            - name: SHUTDOWN_TIMEOUT_MS
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: SHUTDOWN_TIMEOUT_MS } }
            - name: HTTP_KEEP_ALIVE_TIMEOUT_MS
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: HTTP_KEEP_ALIVE_TIMEOUT_MS } }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: LOG_LEVEL } }
            - name: FEATURE_CREDIT_SALES_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_CREDIT_SALES_ENABLED } }
            - name: FEATURE_RETURNS_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_RETURNS_ENABLED } }
            - name: FEATURE_CANCELLATIONS_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_CANCELLATIONS_ENABLED } }
            - name: FEATURE_OCR_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_OCR_ENABLED } }
            - name: FEATURE_IMPORTS_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_IMPORTS_ENABLED } }
            - name: FEATURE_DOCUMENTS_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_DOCUMENTS_ENABLED } }
            - name: FEATURE_MEDIA_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_MEDIA_ENABLED } }
            - name: FEATURE_PROCUREMENT_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_PROCUREMENT_ENABLED } }
            - name: FEATURE_DASHBOARD_INSIGHTS_ENABLED
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: FEATURE_DASHBOARD_INSIGHTS_ENABLED } }
            - name: BACKUP_STATUS_DIR
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: BACKUP_STATUS_DIR } }
            - name: EMAIL_FROM
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: EMAIL_FROM } }
            - name: SENTRY_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: SENTRY_ENVIRONMENT } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: REDIS_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: JWT_SECRET } }
            - name: SMTP_URL
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: SMTP_URL } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: GEMINI_API_KEY } }
            # The web's Google client id: the API accepts only id tokens issued for it.
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: GOOGLE_CLIENT_ID } }
            - name: METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: METRICS_TOKEN } }
            - name: SENTRY_DSN
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: SENTRY_DSN } }
          volumeMounts:
            - name: storage
              mountPath: /var/lib/dukaanai/storage
            - name: uploads
              mountPath: /app/apps/api/uploads
            - name: backups
              mountPath: /var/lib/dukaanai/backups
              readOnly: true
            - name: db-ca
              mountPath: /etc/dukaanai
              readOnly: true
            - name: tmp-api
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 1Gi }
        # Backups without cron (scripts/db/db-ops.sh backup-loop, roadmap
        # 9.7): the daily dump of the managed database, the documents
        # archive and the encrypted off-site copy, each success stamped under
        # BACKUP_STATUS_DIR for backup_last_success_timestamp_seconds. It
        # shares the pod so it reads the ReadWriteOnce volumes. Over TLS like
        # the API: DB_OPS_DATABASE_URL carries the same sslaccept / sslcert=
        # options and the CA is mounted at /etc/dukaanai/db-ca.pem, where the
        # MySQL clients of scripts/db verify the server (audit R9).
        - name: backup-agent
          image: dukaanai-db-ops
          args: ["backup-loop"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: DB_OPS_DATABASE_URL } }
            # Read-only root file system: the scripts' staging and rclone's
            # files go to /tmp.
            - name: HOME
              value: /tmp
            - name: BACKUP_DIR
              value: /backups
            - name: STORAGE_ROOT
              value: /data/storage
            - name: MEDIA_DIR
              value: /data/uploads/media
            - name: DOCUMENTS_BACKUP_DIR
              value: /backups/documents
            - name: BACKUP_COORDINATES
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: BACKUP_COORDINATES } }
            - name: BACKUP_LOOP_INTERVAL_SECONDS
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: BACKUP_LOOP_INTERVAL_SECONDS } }
            - name: BACKUP_LOOP_INITIAL_DELAY_SECONDS
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: BACKUP_LOOP_INITIAL_DELAY_SECONDS } }
            - name: BACKUP_KEEP
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: BACKUP_KEEP } }
            - name: DOCUMENTS_BACKUP_KEEP
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: DOCUMENTS_BACKUP_KEEP } }
            - name: OFFSITE_KEEP_DAYS
              valueFrom: { configMapKeyRef: { name: dukaanai-config, key: OFFSITE_KEEP_DAYS } }
            - name: OFFSITE_REMOTE
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: OFFSITE_REMOTE } }
            - name: OFFSITE_CRYPT_PASSWORD
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: OFFSITE_CRYPT_PASSWORD } }
            - name: OFFSITE_CRYPT_SALT
              valueFrom: { secretKeyRef: { name: dukaanai-secrets, key: OFFSITE_CRYPT_SALT } }
          volumeMounts:
            - name: backups
              mountPath: /backups
            - name: storage
              mountPath: /data/storage
              readOnly: true
            - name: uploads
              mountPath: /data/uploads
              readOnly: true
            - name: db-ca
              mountPath: /etc/dukaanai
              readOnly: true
            - name: tmp-backup
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: dukaanai-storage
        - name: uploads
          persistentVolumeClaim:
            claimName: dukaanai-uploads
        - name: backups
          persistentVolumeClaim:
            claimName: dukaanai-backups
        - name: db-ca
          secret:
            secretName: dukaanai-db-ca
            optional: true
        - name: tmp-api
          emptyDir: { sizeLimit: 1Gi }
        # The scripts' staging directories (the documents archive is staged
        # as symlinks; the archive itself is written to /backups).
        - name: tmp-backup
          emptyDir: { sizeLimit: 2Gi }
