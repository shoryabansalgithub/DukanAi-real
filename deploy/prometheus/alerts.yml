# Alert rules for the DukaanAI API (roadmap 7.6). Load them into Prometheus
# with `rule_files` (see prometheus.yml next to this file) and route the
# `severity` label in Alertmanager. Thresholds come from the recorded load
# baseline (docs/LOAD_TEST_BASELINE.md: checkout p95 < 500 ms, zero 5xx) and
# the outbox / retention settings. Every alert's runbook_url is its page in
# docs/RUNBOOKS.md (roadmap 9.22; runbooks.spec.ts keeps the two in step and
# docs/OBSERVABILITY.md has the one-line summary). Validate after an edit:
# `promtool check rules deploy/prometheus/alerts.yml`.
#
# keep_firing_for: 2m on every alert read from a gauge the API exports
# (storage, outbox, backups, reconciliation, queues): a restart of the API
# (any deploy, one replica) fails one scrape, its series go stale, and a
# firing alert resolved with its cause still there, then waited out its
# `for:` again (walking DukaanAiReconciliationStale, roadmap 9.22: resolved
# at the redeploy, pending again ten seconds later, 30 minutes from a new
# page). Rates and increases read range vectors and are not affected.
groups:
  - name: dukaanai-api
    rules:
      # ---- availability -------------------------------------------------
      - alert: DukaanAiApiDown
        expr: up{job="dukaanai-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaiapidown"
          summary: "API instance {{ $labels.instance }} is not scrapeable"
          description: "Prometheus could not scrape /api/metrics for 2 minutes. Check the readiness probe (/api/health/ready) and the container logs."

      # ---- 5xx rate -------------------------------------------------------
      # More than 1 % of answers are server errors, with enough traffic to
      # mean something (at least one request every 10 s on average), for five
      # minutes in a row. The ratio is taken over 2 minutes: over 5 minutes,
      # the 60-second MySQL drill (roadmap 9.18) kept the trailing ratio above
      # 1 % long enough to page on-call 4.5 minutes AFTER every user had
      # recovered. Outages shorter than about 3 minutes are the probes' job
      # (DukaanAiEndpointDown, DukaanAiDependencyDown); this one is for a
      # sustained error rate. The readiness route is left out: it answers 503
      # by design while a dependency is away, and the probes polling it made
      # the 5-minute Redis drill page "5xx" while every sale succeeded.
      - alert: DukaanAiHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{job="dukaanai-api", status=~"5..", route!~"/api/health.*"}[2m]))
              /
            sum(rate(http_requests_total{job="dukaanai-api", route!~"/api/health.*"}[2m]))
          ) > 0.01
          and
          sum(rate(http_requests_total{job="dukaanai-api", route!~"/api/health.*"}[2m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaihigh5xxrate"
          summary: "More than 1% of API answers are 5xx"
          description: "{{ $value | humanizePercentage }} of requests have failed server-side for 5 minutes. Read the JSON logs for the correlation ids of the 500s and the error tracker for the stack traces; 503 DATABASE_UNAVAILABLE and 507 STORAGE_FULL name their cause in the answer."

      # ---- dependencies (roadmap 9.18) -----------------------------------
      # dependency_up is probed on every scrape (SELECT 1, Redis PING, 2 s
      # each). While the database is away every request answers 503
      # DATABASE_UNAVAILABLE; while Redis is away sales continue (stock keys,
      # cache and rate-limit counters fall back in-process) but queued work
      # (outbox relays, webhooks, imports) waits. Two minutes, like the probes.
      # keep_firing_for: the minute-long probes clear up to a minute after the
      # dependency is back; while this keeps firing their EndpointDown stays
      # held back, so recovery never sends a late page (the Redis drill saw a
      # 50-second gap without it).
      - alert: DukaanAiDependencyDown
        expr: min by (dependency) (dependency_up{job="dukaanai-api"}) == 0
        for: 2m
        keep_firing_for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaidependencydown"
          summary: "The API cannot reach {{ $labels.dependency }}"
          description: "Every API instance has failed to reach {{ $labels.dependency }} for 2 minutes. database: sign-in, sales and every page answer 503 until it is back; check the MySQL host or provider status and the connection limit. redis: sales continue, background jobs wait; check the Redis host. The readiness probe (DukaanAiEndpointDown on /api/health/ready) is held back while this fires."

      # ---- storage volumes (roadmap 9.18) --------------------------------
      # Free space of the volumes under STORAGE_ROOT (documents) and
      # UPLOAD_TEMP_DIR (uploads in flight), from statfs on every scrape.
      # Sales live in MySQL and continue on a full documents volume; bill
      # photos, invoice PDFs and statements are refused (507 STORAGE_FULL).
      - alert: DukaanAiStorageLow
        expr: min by (volume) (storage_volume_free_bytes{job="dukaanai-api"} / storage_volume_size_bytes{job="dukaanai-api"}) < 0.10
        for: 15m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaistoragelow"
          summary: "The {{ $labels.volume }} volume has less than 10% free"
          description: "{{ $value | humanizePercentage }} of the {{ $labels.volume }} volume is free. Grow the disk (docs/DEPLOYMENT.md, production topology) or remove what is reproducible (imports/, exports/, tmp/ under the uploads volume) before documents are refused."
      - alert: DukaanAiStorageFull
        expr: min by (volume) (storage_volume_free_bytes{job="dukaanai-api"} / storage_volume_size_bytes{job="dukaanai-api"}) < 0.02
        for: 1m
        keep_firing_for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaistoragefull"
          summary: "The {{ $labels.volume }} volume is full"
          description: "Only {{ $value | humanizePercentage }} of the {{ $labels.volume }} volume is free: bill photos, invoice PDFs and statements are refused with 507 STORAGE_FULL (sales continue). Free or grow the volume now; nothing partial is kept, so users repeat the upload once space is back."

      # Any unhandled error that reached error tracking: visible even when
      # traffic is too low for the ratio above.
      - alert: DukaanAiUnhandledErrors
        expr: increase(errors_tracked_total{job="dukaanai-api", kind=~"unhandled|prisma"}[15m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaiunhandlederrors"
          summary: "Unhandled API errors in the last 15 minutes"
          description: "{{ printf \"%.0f\" $value }} server-side errors were handed to error tracking (kind={{ $labels.kind }}). Each carries its correlation id as a tag."

      # ---- ledger -------------------------------------------------------
      # A ledger posting that threw means a sale, return, receipt or payment
      # transaction rolled back (or an unbalanced posting reached the ledger).
      - alert: DukaanAiLedgerPostingFailures
        expr: increase(ledger_posting_failures_total{job="dukaanai-api"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanailedgerpostingfailures"
          summary: "Ledger posting failed (source {{ $labels.source }})"
          description: "{{ printf \"%.0f\" $value }} ledger posting(s) threw in the last 10 minutes; each business transaction was rolled back and the client saw an error. A session holding LedgerAccountBalance rows makes sales wait out the lock wait timeout and answer 503 DATABASE_UNAVAILABLE while readiness stays 200 (sys.innodb_lock_waits names it); 'Unbalanced ledger posting' in the logs is a defect."

      # ---- checkout latency ---------------------------------------------
      - alert: DukaanAiCheckoutSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(checkout_duration_seconds_bucket{job="dukaanai-api", outcome="completed"}[10m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaicheckoutslow"
          summary: "Checkout p95 above 500 ms"
          description: "The 95th percentile of completed checkouts is {{ $value | humanizeDuration }} over 10 minutes (baseline: under 500 ms at 3x peak). Check MySQL lock waits (one shop bills serially by design), the MySQL slow query log and Redis latency."

      # ---- outbox -------------------------------------------------------
      # The relays claim PENDING rows every few seconds; a row older than five
      # minutes that is still waiting means the relay crons are not running
      # (CRON_ENABLED, cron lock held by a dead pod) or the worker is stuck.
      - alert: DukaanAiOutboxLag
        expr: max(outbox_oldest_pending_age_seconds{job="dukaanai-api"}) > 300
        for: 10m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaioutboxlag"
          summary: "Outbox rows have been waiting for more than 5 minutes"
          description: "The oldest PENDING/CLAIMED outbox row is {{ $value | humanizeDuration }} old. Check that the relay crons run (one pod holds cron:outbox-reaper etc.), the system-events / purchase-events / webhook workers are connected (queue_jobs), and Redis."

      - alert: DukaanAiOutboxFailedRows
        expr: max(outbox_rows{job="dukaanai-api", status="FAILED"}) > 0
        for: 15m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaioutboxfailedrows"
          summary: "Outbox rows exhausted their retries"
          description: "{{ $value }} outbox row(s) are FAILED. They carry their last error; list them with GET /sales/events?status=FAILED and re-queue with POST /sales/events/retry once the cause is fixed."

      # ---- backups (roadmap 9.4) ------------------------------------------
      # backup_last_success_timestamp_seconds{kind} is read by the API from
      # BACKUP_STATUS_DIR, where every backup job records its last success
      # (scripts/db/lib.sh record_success). Thresholds follow the objectives
      # in docs/DATA_SAFETY.md: the binary-log archive runs every 5 minutes
      # (15 min of slack), the dump, the documents archive and the off-site
      # copy run nightly (26 h). alerts.test.yml proves both rules fire.
      - alert: DukaanAiBackupStale
        expr: |
          (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="binlog"}) > 900
          or (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="dump"}) > 93600
          or (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="documents"}) > 93600
          or (time() - backup_last_success_timestamp_seconds{job="dukaanai-api", kind="offsite"}) > 93600
        for: 5m
        keep_firing_for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaibackupstale"
          summary: "Backup job {{ $labels.kind }} has not succeeded in time"
          description: "The last successful {{ $labels.kind }} backup was {{ $value | humanizeDuration }} ago (limits: binlog 15 min, dump / documents / offsite 26 h). The recovery point is growing: run `db-ops status`, then the job by hand (db-ops backup, binlog-archive --flush, documents-backup, offsite push) and read its error."

      - alert: DukaanAiBackupNeverRecorded
        expr: |
          absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="dump"})
          or absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="binlog"})
          or absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="documents"})
          or absent(backup_last_success_timestamp_seconds{job="dukaanai-api", kind="offsite"})
        for: 30m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaibackupneverrecorded"
          summary: "Backup job {{ $labels.kind }} has never recorded a success"
          description: "No backup_last_success_timestamp_seconds series for kind {{ $labels.kind }}. Either the job is not scheduled, or the API cannot read BACKUP_STATUS_DIR (the db-backups volume mounted read-only), or the job writes its stamp elsewhere."

      # ---- financial reconciliation (roadmap 9.5) --------------------------
      # reconciliation_shops_with_drift counts the shops whose latest run
      # (nightly cron or on demand) ended in DRIFT or FAILED, read from the
      # ReconciliationRun table on every scrape, so a restart or a scrape of
      # another instance shows the same figure. Nothing is corrected by the
      # job: a person reads the run and explains or fixes the books.
      - alert: DukaanAiReconciliationDrift
        expr: max(reconciliation_shops_with_drift{job="dukaanai-api"}) > 0
        for: 0m
        keep_firing_for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaireconciliationdrift"
          summary: "Financial reconciliation found drift"
          description: "{{ $value }} shop(s) have a latest reconciliation run that ended in DRIFT or FAILED. Read it as the shop owner (GET /reconciliation/latest), or in the API container (node dist/cli/reconcile --shop <id> --date <day>): every drift names the check, the document or row and the two figures that disagree. The books are never corrected automatically."

      # The nightly job has not recorded a run anywhere for 26 hours: it is
      # not scheduled on any instance (CRON_ENABLED, CRON_RECONCILIATION), or
      # it fails before a run row is written.
      - alert: DukaanAiReconciliationStale
        # The gauge is exported as 0 until a run exists (an unlabelled
        # prom-client gauge always has a sample): 0 is "never", not 1970.
        expr: (time() - max(reconciliation_last_run_timestamp_seconds{job="dukaanai-api"} > 0)) > 93600
        for: 30m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaireconciliationstale"
          summary: "No financial reconciliation run in 26 hours"
          description: "The most recent reconciliation run finished {{ $value | humanizeDuration }} ago. Check CRON_ENABLED on at least one instance, CRON_RECONCILIATION, the cron:reconciliation lock and the 'Reconciliation' lines in the API logs (in Loki: a container's own log starts at its start); run the missed night in the API container with node dist/cli/reconcile --all-shops."

      # ---- queues -------------------------------------------------------
      - alert: DukaanAiQueueBacklog
        expr: max by (queue) (queue_jobs{job="dukaanai-api", state="waiting"}) > 1000
        for: 15m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaiqueuebacklog"
          summary: "BullMQ queue {{ $labels.queue }} has a backlog"
          description: "{{ $value }} jobs are waiting on {{ $labels.queue }} for 15 minutes: the queue is paused (queue_paused is 1; a pause is kept in Redis, a restart does not lift it), or its worker is not running or not keeping up. Check queue_paused, then the worker's errors in the logs; add an API instance for a sustained load."

      - alert: DukaanAiQueueFailedJobs
        expr: max by (queue) (queue_jobs{job="dukaanai-api", state="failed"}) > 0
        for: 30m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaiqueuefailedjobs"
          summary: "BullMQ queue {{ $labels.queue }} holds failed jobs"
          description: "{{ $value }} job(s) on {{ $labels.queue }} failed every attempt. The job data and the last error are in Redis (the queue's failed set); a job that names an outbox row also marked that row FAILED."

  # Abuse (roadmap 9.15, ASVS 7.2.3 / 11.1.8): the credential routes are
  # answering 429 for ten minutes, i.e. the brute-force limits are doing
  # their job against a sustained flood (one refused attempt every ten
  # seconds on average, well above what a mistyped password produces).
  - name: dukaanai-abuse
    rules:
      - alert: DukaanAiCredentialFlood
        expr: sum(rate(http_requests_total{job="dukaanai-api", route=~"/api/auth/.*", status="429"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaicredentialflood"
          summary: "Credential routes are rate-limiting a sustained flood"
          description: "{{ printf \"%.2f\" $value }} login/register/refresh attempts per second have been refused with 429 for 10 minutes. The limits hold (docs/PRODUCTION_LIMITS.md); read the access log for the source addresses and accounts (event=http, status=429, route=/api/auth/...) and block the source at the edge if it persists."

  # Email (roadmap 9.19): the mail relay refused a message or could not be
  # reached. An invitation answers the owner 502 INVITATION_EMAIL_FAILED, but
  # a reset link that was not delivered is invisible by design
  # (forgot-password gives every address the same answer), so this is how
  # anyone learns that sign-in recovery stopped working.
  - name: dukaanai-email
    rules:
      - alert: DukaanAiEmailDeliveryFailing
        expr: sum by (purpose) (increase(email_messages_total{job="dukaanai-api", outcome="failed"}[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaiemaildeliveryfailing"
          summary: "Email delivery is failing ({{ $labels.purpose }})"
          description: "{{ printf \"%.0f\" $value }} {{ $labels.purpose }} message(s) were not accepted by the mail relay in the last 30 minutes. Check SMTP_URL (credentials, quota) and the sender EMAIL_FROM against the provider, then the API log lines 'was not accepted by the relay' for the relay's own reply."

  # Uptime (roadmap 9.10): the blackbox probes of the readiness route and the
  # login page (deploy/blackbox/blackbox.yml, every minute).
  - name: dukaanai-uptime
    rules:
      - alert: DukaanAiEndpointDown
        expr: probe_success{job=~"blackbox-http|blackbox-login"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaiendpointdown"
          summary: "{{ $labels.instance }} has failed its probe for 2 minutes"
          description: "The readiness route or the login page does not answer as expected ({{ $labels.job }}). Check the edge, then GET /api/health/ready for the failing dependency. An expired certificate pages as DukaanAiCertificateExpired and holds this alert back; a certificate that does not verify for another reason (wrong name, incomplete chain, unknown issuer) fails this probe too: curl -vI the address."
      # The certificate alerts read job blackbox-tls, which reads the
      # certificate whether or not it verifies. On the verified probes the
      # series disappears the moment the certificate expires: the warning
      # resolved itself and two minutes later an EndpointDown paged with no
      # cause (the certificate drill of roadmap 9.18). Now the warning ends
      # at expiry because the page that names it starts.
      - alert: DukaanAiCertificateExpiring
        expr: 0 < (probe_ssl_earliest_cert_expiry{job="blackbox-tls"} - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaicertificateexpiring"
          summary: "The certificate of {{ $labels.instance }} expires in under 14 days"
          description: "Automatic renewal has not happened (Caddy: ports 80/443 reachable, DNS; cert-manager: the Certificate resource; a certificate installed as a file is never renewed). Renew before it lapses."
      # keep_firing_for: the verified probes recover up to a minute after
      # the renewed certificate is read (another job, another scrape
      # offset), and their DukaanAiEndpointDown must stay held back until
      # they have, as for DukaanAiDependencyDown.
      - alert: DukaanAiCertificateExpired
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-tls"} - time()) <= 0
        keep_firing_for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/shoryabansalgithub/DukanAi-real/blob/main/docs/RUNBOOKS.md#dukaanaicertificateexpired"
          summary: "The certificate of {{ $labels.instance }} has expired"
          description: "Every browser refuses this address and every client call to it fails (certificate has expired). Renew now: Caddy renews on restart when ports 80/443 and DNS are right (docker compose logs edge); a file certificate is replaced and the edge reloaded (caddy reload --force); cert-manager: kubectl describe certificate. The failing probe of the same address (DukaanAiEndpointDown) is held back while this fires."
