# Grafana data sources (roadmap 9.10), provisioned at start: Prometheus for
# the metrics dashboard, Loki for the log search. The uids are what the
# dashboard JSON files reference.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
