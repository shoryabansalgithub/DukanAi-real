name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # apps/api/.env.test targets these; the service containers below expose them on localhost.
  TEST_DATABASE_URL: mysql://root:password@127.0.0.1:3306/dukaanai_test?connection_limit=25&pool_timeout=120
  TEST_REDIS_URL: redis://127.0.0.1:6379/1

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # turbo builds in dependency order: invoice-math -> api -> web.
      - run: npx turbo run build
      - run: npx turbo run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      # Roadmap 9.11 / 9.14: no secret in any committed file. The release binary
      # is pinned by checksum (no third-party action); .gitleaks.toml allowlists
      # the test fixtures by file and pattern. Runs before `npm ci` so the
      # tree scan covers only what the repository ships.
      - name: No secret in the tree or the history (gitleaks)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks dir . --no-banner --redact --config .gitleaks.toml
          /tmp/gitleaks/gitleaks git . --no-banner --redact --config .gitleaks.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint depends on ^build (type-aware API rules need invoice-math/dist).
      - run: npx turbo run lint
      # Phase 7 exit gate: no high or critical advisory in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
      # Roadmap 7.4: runtime artifacts (uploads, storage documents, turbo daemon logs) are never tracked.
      - run: bash scripts/check-tracked-artifacts.sh
      # Roadmap 9.21: the release checker's own tests, and CHANGELOG.md in the
      # shape a release needs (dated sections, newest first = package.json).
      - run: node --test scripts/release/release.test.mjs
      - run: node scripts/release/release.mjs lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # invoice-math + api unit suites (web has no unit suite).
      - run: npx turbo run test
      - name: API boot regression (test:e2e)
        working-directory: apps/api
        run: npm run test:e2e

  integration:
    name: Integration tests (MySQL 8 + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dukaanai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@dukaanai/invoice-math
      - name: Applied migrations are immutable
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          bash apps/api/scripts/check-migrations-immutable.sh "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
      - name: Migrate test database
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Verify migrations match schema.prisma
        working-directory: apps/api
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Integration suites
        working-directory: apps/api
        run: npm run test:integration
      # Roadmap 7.7: the restore drill rehearses backup.sh + restore.sh against
      # the MySQL 8 service, on the data the suites just wrote (mysqldump,
      # mysqlbinlog and mysql 8 come with the runner image). --pitr require:
      # the point-in-time steps (binary-log archive, restore --to) must run,
      # so a service container without a binary log fails the job (9.2).
      - name: Backup and restore drill (MySQL 8)
        run: bash scripts/db/restore-drill.sh --pitr require
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # Documents and off-site drills (roadmap 9.3, 9.4): the evidence files the
      # suites wrote restore byte for byte; a fresh backup set ships encrypted
      # to a local bucket, comes back on a clean workspace and restores.
      - name: rclone for the off-site drill
        run: sudo apt-get install -y -q rclone >/dev/null
      - name: Documents restore drill (storage root and product images)
        run: bash scripts/storage/restore-drill.sh --root apps/api/data/storage${MEDIA:+ --media apps/api/uploads/media}
        env:
          MEDIA: ${{ hashFiles('apps/api/uploads/media/**') }}
      - name: Off-site restore drill (encrypted copy, clean-machine fetch, restore)
        run: bash scripts/backup/offsite-drill.sh --root apps/api/data/storage
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          OFFSITE_REMOTE: local:${{ runner.temp }}/offsite-bucket
          OFFSITE_CRYPT_PASSWORD: ci-drill-password-of-at-least-32-characters

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dukaanai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Compiled API boots faster than `nest start`; playwright.config.ts starts it via E2E_API_COMMAND.
      - run: npx turbo run build --filter=api
      - name: Migrate test database
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_API_COMMAND: node dist/main
          E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/dukaanai_test
      # Roadmap 6.9: the same pages without the auth bypass (real sign-in, role gating).
      - name: Playwright (real auth)
        working-directory: apps/web
        run: npm run test:e2e:auth
        env:
          CI: 'true'
          E2E_API_COMMAND: node dist/main
          E2E_DATABASE_URL: mysql://root:password@127.0.0.1:3306/dukaanai_test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-auth
          retention-days: 7

  deploy:
    name: Deployment (compose smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      # Phase 7 exit gate (roadmap 7.3): fresh clone -> images built from the
      # Dockerfiles -> `docker compose up` -> migrations -> login -> a sale,
      # then a graceful stop of the API (SIGTERM, readiness 503, exit 0).
      # Roadmap 7.6: the alert rules and the example scrape config must parse
      # before they can be mounted into Prometheus.
      # Roadmap 9.14: the image vulnerability gate is not a no-op. Trivy must flag a
      # pinned known-vulnerable image; if it ever comes back clean the control fails
      # loudly (so the release gate that scans the real images is never silently empty).
      - name: Vulnerability scanner catches a known-vulnerable image (control)
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/certify/trivy-scan.sh control
      - name: Alert rules are valid (promtool)
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /rules/prometheus.yml
          # The stale-backup alert fires in a drill (roadmap 9.4).
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 test rules /rules/alerts.test.yml
      # Roadmap 9.7 / 9.8: the edge configuration and the Kubernetes manifests
      # must be valid before they are shipped (the hostnames are placeholders:
      # validation never contacts a CA or a cluster).
      # Roadmap 9.10: the Alertmanager template renders (none, email-only and
      # fully configured) into a config amtool accepts, and routes a critical
      # alert to the on-call and the team, a warning to the team only.
      - name: Alert delivery configuration renders and routes (amtool)
        run: |
          docker run --rm -v "$PWD/deploy/alertmanager:/tmpl:ro" --entrypoint /bin/sh prom/alertmanager:v0.34.1 -c '
            sh /tmpl/render.sh --out /tmp/none.yml --secrets /tmp/s0 && amtool check-config /tmp/none.yml &&
            ALERT_EMAIL_TO=ops@example.com ALERT_SMTP_SMARTHOST=smtp.example.com:587 sh /tmpl/render.sh --out /tmp/email.yml --secrets /tmp/s1 && amtool check-config /tmp/email.yml &&
            ALERT_EMAIL_TO=ops@example.com ALERT_SMTP_SMARTHOST=smtp.example.com:587 ALERT_SMTP_USERNAME=u ALERT_SMTP_PASSWORD=p ALERT_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/x ALERT_PAGERDUTY_ROUTING_KEY=k sh /tmpl/render.sh --out /tmp/all.yml --secrets /tmp/s2 && amtool check-config /tmp/all.yml &&
            test "$(amtool config routes test --config.file /tmp/all.yml severity=critical alertname=DukaanAiApiDown)" = "oncall,team" &&
            test "$(amtool config routes test --config.file /tmp/all.yml severity=warning alertname=DukaanAiOutboxLag)" = "team"'
      - name: Edge configuration is valid (caddy validate)
        run: |
          docker run --rm -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e WEB_HOST=app.example.com -e API_HOST=api.example.com caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Kubernetes manifests are valid (kustomize build + kubeconform)
        run: |
          cp deploy/k8s/dukaanai-secrets.env.example deploy/k8s/dukaanai-secrets.env
          kubectl kustomize deploy/k8s | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
          rm deploy/k8s/dukaanai-secrets.env
      - name: Fresh clone -> compose up -> migrate -> login -> sale
        run: bash scripts/compose-smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      # Roadmap 9.7 / 9.8 gate: the production variant against an external
      # TLS-only MySQL, HTTPS through the edge, sign-in and a sale over it,
      # the rate limit counted per client address, the backup agent.
      - name: Production variant -> external TLS database -> HTTPS through the edge -> sale, rate limit per client, backups
        run: bash scripts/compose-smoke-prod.sh
      - name: Container logs (production variant)
        if: failure()
        run: |
          docker ps -a --filter label=com.docker.compose.project=dukaanai-prod
          for c in $(docker ps -aq --filter label=com.docker.compose.project=dukaanai-prod); do
            echo "=== $c ($(docker inspect --format '{{.Name}}' "$c"))"; docker logs --tail=200 "$c" 2>&1 || true
          done
