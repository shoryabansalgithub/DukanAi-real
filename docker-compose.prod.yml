# DukaanAI, production variant (roadmap 9.7, 9.8): the same images and the
# same release step as docker-compose.yml, but the database and Redis are
# external managed services, documents live on a persistent disk, and the
# edge terminates HTTPS. Nothing here publishes a port except the edge.
#
#   cp .env.example .env    # set JWT_SECRET, NEXTAUTH_SECRET, METRICS_TOKEN, GRAFANA_ADMIN_PASSWORD,
#                           # DATABASE_URL, REDIS_URL, WEB_HOST / API_HOST (+ WEB_ORIGIN /
#                           # API_PUBLIC_URL), STORAGE_PATH, IMAGE_TAG (the release to run)
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm migrate     # the release step, alone
#   docker compose -f docker-compose.prod.yml up -d --wait
#
# Needs Docker Compose 2.24.4 or newer (`include` with an override list,
# `!reset` in the overlays; docs/DEPLOYMENT.md, "Requirements").
#
# Nothing is built on a server (roadmap 9.9): the images come from the
# registry the release workflow pushed them to (.github/workflows/release.yml,
# ghcr.io/<owner>/dukaanai-{api,web,db-ops}:<tag>), and staging and
# production run the same tag. docker-compose.build.yml is the overlay that
# builds them from a checkout instead (the compose smoke, local work).
#
# Topology this file implements (docs/DEPLOYMENT.md, "Production topology"):
#   one host, one API replica, documents on a cloud disk mounted at
#   STORAGE_PATH (snapshots by the provider), managed MySQL 8 reached over TLS
#   (DATABASE_URL carries ?sslaccept=strict and, for a private CA, sslcert=
#   with DB_CA_FILE mounted), managed Redis (rediss:// for TLS), Caddy on
#   80/443 with automatic certificates for WEB_HOST and API_HOST.
# The compose smoke runs this file against an external TLS-only MySQL
# (scripts/compose-smoke-prod.sh, CI job "Deployment (compose smoke)").
name: dukaanai-prod

# The monitoring stack (profile "ops": Prometheus, Alertmanager, blackbox
# probes, Loki, Alloy, Grafana) is the same file the reference stack
# includes, with the production overrides on top: the production backup
# kinds, the public probes, no default Grafana password
# (deploy/observability/compose.prod.yml). Its ports are published on
# 127.0.0.1 only: reach them through an SSH tunnel (docs/DEPLOYMENT.md).
include:
  - path:
      - deploy/observability/compose.yml
      - deploy/observability/compose.prod.yml
    project_directory: .

# Every container's log rotates (json-file, 5 x 10 MB; audit 2026-10-11,
# R13). The daemon-wide alternative is /etc/docker/daemon.json
# (docs/DEPLOYMENT.md, "Container logs").
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-database-url: &database-url ${DATABASE_URL:?Set DATABASE_URL in .env (mysql://user:pass@host:3306/db?connection_limit=20&sslaccept=strict)}
# The CA of a private certificate authority, mounted where DATABASE_URL's
# sslcert= points (`sslcert=/etc/dukaanai/db-ca.pem`) in every container that
# connects to the database: migrate, the API, the backup agent and db-ops
# (whose MySQL clients verify the server against it; audit R9). Unset = the
# system trust store (a provider certificate signed by a public CA needs
# nothing).
x-db-ca: &db-ca ${DB_CA_FILE:-/dev/null}:/etc/dukaanai/db-ca.pem:ro

services:
  # Release step: applies pending migrations against the managed database and
  # exits; `api` starts only after it succeeded. Re-run on every deploy.
  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/shoryabansalgithub}/dukaanai-api:${IMAGE_TAG:?}
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    volumes:
      - *db-ca
    logging: *logging
    restart: "no"

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/shoryabansalgithub}/dukaanai-api:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      PORT: "3002"
      FRONTEND_URL: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env (https://app.example.com)}
      DATABASE_URL: *database-url
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (redis:// or rediss://host:6379/0)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters, e.g. `openssl rand -hex 32`)}
      # Exactly one proxy in front: the edge (and the web server on sign-in,
      # which forwards what the edge gave it). A load balancer before the edge
      # is a second hop: set TRUST_PROXY=2 then.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STORAGE_ROOT: /var/lib/dukaanai/storage
      UPLOAD_TEMP_DIR: uploads/tmp
      SHUTDOWN_DRAIN_DELAY_MS: "0"
      SHUTDOWN_TIMEOUT_MS: "30000"
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-DukaanAI <no-reply@dukaanai.local>}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Google sign-in: the API verifies id tokens against the web's client id.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      # Feature pause switches (roadmap 9.23, docs/SUPPORT.md): set one to false in .env, then `up -d api`.
      FEATURE_CREDIT_SALES_ENABLED: ${FEATURE_CREDIT_SALES_ENABLED:-true}
      FEATURE_RETURNS_ENABLED: ${FEATURE_RETURNS_ENABLED:-true}
      FEATURE_CANCELLATIONS_ENABLED: ${FEATURE_CANCELLATIONS_ENABLED:-true}
      FEATURE_OCR_ENABLED: ${FEATURE_OCR_ENABLED:-true}
      FEATURE_IMPORTS_ENABLED: ${FEATURE_IMPORTS_ENABLED:-true}
      FEATURE_DOCUMENTS_ENABLED: ${FEATURE_DOCUMENTS_ENABLED:-true}
      FEATURE_MEDIA_ENABLED: ${FEATURE_MEDIA_ENABLED:-true}
      FEATURE_PROCUREMENT_ENABLED: ${FEATURE_PROCUREMENT_ENABLED:-true}
      FEATURE_DASHBOARD_INSIGHTS_ENABLED: ${FEATURE_DASHBOARD_INSIGHTS_ENABLED:-true}
      # Production answers /api/metrics only with this bearer token (404 without it, and DukaanAiApiDown fires).
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env (32+ characters, e.g. `openssl rand -hex 32`); Prometheus sends it}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # No APP_RELEASE here: the image says which release it is (roadmap 9.21),
      # and any entry, even a blank one, would replace that.
      BACKUP_STATUS_DIR: /var/lib/dukaanai/backups/status
    volumes:
      # STORAGE_PATH / UPLOADS_PATH / BACKUPS_PATH: an absolute path mounts the
      # cloud disk (snapshotted by the provider); the default is a named volume.
      - ${STORAGE_PATH:-api-storage}:/var/lib/dukaanai/storage
      - ${UPLOADS_PATH:-api-uploads}:/app/apps/api/uploads
      - ${BACKUPS_PATH:-db-backups}:/var/lib/dukaanai/backups:ro
      - *db-ca
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 40s
    logging: *logging
    restart: unless-stopped

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/shoryabansalgithub}/dukaanai-web:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (32+ characters, e.g. `openssl rand -hex 32`)}
      NEXTAUTH_URL: ${WEB_ORIGIN}
      # The API as the browser reaches it, read at run time: the same image
      # serves staging and production (roadmap 9.9).
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set API_PUBLIC_URL in .env (https://api.example.com/api)}
      API_INTERNAL_URL: http://api:3002/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Idle connections outlive the edge's (Caddy keeps one 55 s; Node's
      # default would close it after 5 s, a 502 when both race; audit R21).
      KEEP_ALIVE_TIMEOUT: "65000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *logging
    restart: unless-stopped

  # The edge (roadmap 9.8): HTTPS for WEB_HOST and API_HOST, HTTP redirected,
  # client address forwarded, /api/metrics hidden. deploy/edge/Caddyfile.
  edge:
    image: caddy:2.10.2-alpine
    environment:
      WEB_HOST: ${WEB_HOST:?Set WEB_HOST in .env (app.example.com)}
      API_HOST: ${API_HOST:?Set API_HOST in .env (api.example.com)}
      # Empty: automatic public certificates. "tls internal": Caddy's own CA (smoke, staging without DNS).
      EDGE_TLS_LINE: ${EDGE_TLS_LINE:-}
      EDGE_MAX_BODY: ${EDGE_MAX_BODY:-64MB}
      EDGE_UPSTREAM_TIMEOUT: ${EDGE_UPSTREAM_TIMEOUT:-60s}
      EDGE_BLOCKED_IPS: ${EDGE_BLOCKED_IPS:-0.0.0.0/32}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  # Backups without host cron (roadmap 9.2 to 9.4): `backup-loop` dumps the
  # managed database, archives the documents and ships the encrypted off-site
  # copy every BACKUP_LOOP_INTERVAL_SECONDS (a day), stamping each success for
  # the backup metric. Point-in-time recovery is the provider's on a managed
  # MySQL; the dump is the independent copy and the off-site set the one that
  # survives the account. DB_OPS_DATABASE_URL may name a backup user with
  # RELOAD + REPLICATION CLIENT (binary-log position in the dump) or the
  # application user with BACKUP_COORDINATES=skip. Over TLS like the API:
  # DB_OPS_DATABASE_URL carries the same sslaccept / sslcert= options and the
  # CA is mounted at /etc/dukaanai/db-ca.pem, where the MySQL clients of
  # scripts/db verify the server (audit R9). Runs as uid 1000 (the API's
  # user, so it reads every document the API wrote), never root (audit R25):
  # backup-volume-init hands it the backup volume first.
  backup-agent:
    image: ${IMAGE_REGISTRY:-ghcr.io/shoryabansalgithub}/dukaanai-db-ops:${IMAGE_TAG:?}
    command: ["backup-loop"]
    user: "1000:1000"
    environment:
      # No home directory for uid 1000 in the image: rclone and the MySQL clients look in HOME.
      HOME: /tmp
      DATABASE_URL: ${DB_OPS_DATABASE_URL:-${DATABASE_URL}}
      BACKUP_COORDINATES: ${BACKUP_COORDINATES:-auto}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_LOOP_INTERVAL_SECONDS: ${BACKUP_LOOP_INTERVAL_SECONDS:-86400}
      BACKUP_LOOP_INITIAL_DELAY_SECONDS: ${BACKUP_LOOP_INITIAL_DELAY_SECONDS:-60}
      STORAGE_ROOT: /data/storage
      MEDIA_DIR: /data/uploads/media
      DOCUMENTS_BACKUP_DIR: /backups/documents
      DOCUMENTS_BACKUP_KEEP: ${DOCUMENTS_BACKUP_KEEP:-14}
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_CRYPT_PASSWORD: ${OFFSITE_CRYPT_PASSWORD:-}
      OFFSITE_CRYPT_SALT: ${OFFSITE_CRYPT_SALT:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    volumes:
      - ${BACKUPS_PATH:-db-backups}:/backups
      - ${STORAGE_PATH:-api-storage}:/data/storage:ro
      - ${UPLOADS_PATH:-api-uploads}:/data/uploads:ro
      - *db-ca
    depends_on:
      migrate:
        condition: service_completed_successfully
      backup-volume-init:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped

  # Hands the backup volume (a named volume, or the BACKUPS_PATH disk) to the
  # backup jobs' uid 1000, once: a volume created by an earlier root job is
  # re-owned, after that it is a no-op. The only db-ops container that runs
  # as root, and it runs nothing but chown.
  backup-volume-init:
    image: ${IMAGE_REGISTRY:-ghcr.io/shoryabansalgithub}/dukaanai-db-ops:${IMAGE_TAG:?}
    user: "0:0"
    entrypoint: ["sh", "-c", "[ \"$$(stat -c %u:%g /backups)\" = 1000:1000 ] || chown -R 1000:1000 /backups"]
    volumes:
      - ${BACKUPS_PATH:-db-backups}:/backups
    logging: *logging
    restart: "no"

  # One-shot operations against the same volumes (profile "ops"):
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm db-ops backup|status|list|latest
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm db-ops offsite push|check|list|fetch DIR
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm db-ops restore /backups/<file>.sql.gz --database dukaanai_restored --create --yes
  db-ops:
    image: ${IMAGE_REGISTRY:-ghcr.io/shoryabansalgithub}/dukaanai-db-ops:${IMAGE_TAG:?}
    profiles: ["ops"]
    user: "1000:1000"
    environment:
      # No home directory for uid 1000 in the image: rclone and the MySQL clients look in HOME.
      HOME: /tmp
      DATABASE_URL: ${DB_OPS_DATABASE_URL:-${DATABASE_URL}}
      BACKUP_COORDINATES: ${BACKUP_COORDINATES:-auto}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      STORAGE_ROOT: /data/storage
      MEDIA_DIR: /data/uploads/media
      DOCUMENTS_BACKUP_DIR: /backups/documents
      DOCUMENTS_BACKUP_KEEP: ${DOCUMENTS_BACKUP_KEEP:-14}
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_CRYPT_PASSWORD: ${OFFSITE_CRYPT_PASSWORD:-}
      OFFSITE_CRYPT_SALT: ${OFFSITE_CRYPT_SALT:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    volumes:
      - ${BACKUPS_PATH:-db-backups}:/backups
      - ${STORAGE_PATH:-api-storage}:/data/storage:ro
      - ${UPLOADS_PATH:-api-uploads}:/data/uploads:ro
      - *db-ca
    depends_on:
      backup-volume-init:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: "no"

volumes:
  api-storage:
  api-uploads:
  db-backups:
  caddy-data:
  caddy-config:
